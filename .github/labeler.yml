ci:
  - changed-files:
      - any-glob-to-any-file: ".github/**"

docs:
  - changed-files:
      - any-glob-to-any-file:
          - "README.md"
          - "LICENSE"
          - "**/*.md"
          - "docs/**"

tests:
  - changed-files:
      - any-glob-to-any-file: "**/*_test.go"

e2e:
  - changed-files:
      - all-globs-to-any-file: ["e2e/**", "!e2e/**/*.md"]

triggers:
  - changed-files:
      - any-glob-to-any-file: "internal/trigger/**"

alerts:
  - changed-files:
      - any-glob-to-any-file: "internal/lambda/alert/**"

lambda:
  - changed-files:
      - any-glob-to-any-file:
          - "cmd/lambda/**"
          - "internal/lambda/**"

deploy:
  - changed-files:
      - any-glob-to-any-file: "deploy/**"

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - "go.mod"
          - "go.sum"

config:
  - changed-files:
      - any-glob-to-any-file:
          - ".golangci.yml"
          - "Makefile"

types:
  - changed-files:
      - any-glob-to-any-file: "pkg/types/**"
