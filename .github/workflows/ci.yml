name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      docs: ${{ steps.filter.outputs.docs }}
      deploy_scripts: ${{ steps.filter.outputs.deploy_scripts }}
    steps:
      - uses: actions/checkout@v4

      # code is an exclude list on purpose: Go tests read non-Go files (the
      # ASL, Terraform and LocalStack deploy files), so anything that is not
      # docs counts as code. The GitHub config files below are left out too,
      # since nothing in the Go build or tests reads them; ci.yml and
      # e2e-nightly.yml stay as code, so a change to how CI runs the suite
      # still runs it. With 'every', a file counts only when it matches '**'
      # and none of the negated patterns. The quantifier applies to every
      # filter; docs and deploy_scripts each have a single pattern, so
      # 'every' means any file under that directory.
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          predicate-quantifier: 'every'
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!**/*.md'
              - '!LICENSE'
              - '!.github/labeler.yml'
              - '!.github/labels.json'
              - '!.github/CODEOWNERS'
              - '!.github/workflows/labeler.yml'
              - '!.github/workflows/docs.yml'
            docs:
              - 'docs/**'
            deploy_scripts:
              - 'deploy/localstack/**'

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install golangci-lint v2.15.0
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0

      - name: Lint
        run: make lint

  test:
    name: Test (race)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: make test

  e2e-hooks:
    name: E2E hooks
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet and test with -tags e2e
        run: make e2e-check

  build-guards:
    name: Build guards
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check e2e hook wiring and linking
        run: make guards

  # Plans the Terraform module against a mocked AWS provider. The provider is
  # several hundred MB, so the plugin cache is kept between runs.
  terraform-test:
    name: Terraform test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.tf-plugin-cache
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.2
          terraform_wrapper: false

      - uses: actions/cache@v4
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: tf-plugins-${{ runner.os }}-${{ hashFiles('deploy/terraform/main.tf') }}

      - name: Run terraform test
        run: make tf-test

  # The LocalStack stack and the harness run in containers, so the job needs
  # only the checkout. make e2e streams the compose logs and tears down.
  e2e:
    name: E2E (LocalStack)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Run the e2e suite
        run: make e2e

  deploy-scripts:
    name: Deploy script tests
    needs: changes
    if: needs.changes.outputs.deploy_scripts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: deploy/localstack/requirements.txt

      - name: Install dependencies
        run: pip install -r deploy/localstack/requirements.txt

      - name: Run deploy.py unit tests
        working-directory: deploy/localstack
        run: python -m unittest -v test_deploy

  # Same build as docs.yml, without the upload, so a broken site fails the
  # Quality Gate before merge.
  docs-build:
    name: Docs build
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: "0.154.5"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Hugo
        run: |
          wget -O hugo.deb "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i hugo.deb

      - uses: actions/setup-go@v5
        with:
          go-version-file: docs/go.mod
          cache-dependency-path: docs/go.sum

      - name: Build site
        working-directory: docs
        run: hugo --gc --minify --baseURL "https://dwsmith1983.github.io/interlock/"

  # The main ruleset requires this check by name. It runs on every PR, and
  # passes only when each check succeeded, or was skipped because its paths
  # did not change.
  quality-gate:
    name: Quality Gate
    needs: [changes, lint, test, e2e-hooks, build-guards, terraform-test, e2e, docs-build, deploy-scripts]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        env:
          CODE: ${{ needs.changes.outputs.code }}
          DOCS: ${{ needs.changes.outputs.docs }}
          DEPLOY_SCRIPTS: ${{ needs.changes.outputs.deploy_scripts }}
          CHANGES: ${{ needs.changes.result }}
          LINT: ${{ needs.lint.result }}
          TEST: ${{ needs.test.result }}
          E2E_HOOKS: ${{ needs.e2e-hooks.result }}
          BUILD_GUARDS: ${{ needs.build-guards.result }}
          TERRAFORM_TEST: ${{ needs.terraform-test.result }}
          E2E: ${{ needs.e2e.result }}
          DOCS_BUILD: ${{ needs.docs-build.result }}
          DEPLOY_SCRIPTS_TESTS: ${{ needs.deploy-scripts.result }}
        run: |
          status=0
          echo "changes: $CHANGES (code=$CODE, docs=$DOCS, deploy_scripts=$DEPLOY_SCRIPTS)"
          if [ "$CHANGES" != "success" ]; then
            echo "FAIL: changes did not succeed"
            status=1
          fi
          check_flag() {
            if [ "$2" != "true" ] && [ "$2" != "false" ]; then
              echo "FAIL: $1 output is '$2', expected true or false"
              status=1
            fi
          }
          check_flag code "$CODE"
          check_flag docs "$DOCS"
          check_flag deploy_scripts "$DEPLOY_SCRIPTS"
          # check <job> <result> <filter output that gates the job>
          check() {
            echo "$1: $2"
            case "$2" in
              success) ;;
              skipped)
                if [ "$3" != "false" ]; then
                  echo "FAIL: $1 was skipped although its paths changed"
                  status=1
                fi
                ;;
              *)
                echo "FAIL: $1 did not succeed"
                status=1
                ;;
            esac
          }
          check lint "$LINT" "$CODE"
          check test "$TEST" "$CODE"
          check e2e-hooks "$E2E_HOOKS" "$CODE"
          check build-guards "$BUILD_GUARDS" "$CODE"
          check terraform-test "$TERRAFORM_TEST" "$CODE"
          check e2e "$E2E" "$CODE"
          check docs-build "$DOCS_BUILD" "$DOCS"
          check deploy-scripts "$DEPLOY_SCRIPTS_TESTS" "$DEPLOY_SCRIPTS"
          exit "$status"
